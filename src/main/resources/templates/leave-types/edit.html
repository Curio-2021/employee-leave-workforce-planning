<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Leave Type - WorkforcePlan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        .page-header {
            background: linear-gradient(135deg, #0d6efd 0%, #0a4296 100%);
            color: #ffffff;
            border-radius: 0.75rem;
        }
    </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Navigation Bar -->
    <nav th:replace="~{fragments/navbar :: navbar('leave-types')}"></nav>

    <!-- Main Content -->
    <main class="container my-4 flex-grow-1">

        <!-- Page Header -->
        <div class="page-header p-4 mb-4 shadow-sm">
            <div class="d-flex flex-wrap align-items-center justify-content-between gap-3">
                <div>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb mb-1 text-white-50">
                            <li class="breadcrumb-item"><a href="/" class="text-white text-decoration-none">Home</a></li>
                            <li class="breadcrumb-item"><a href="/leave-types" class="text-white text-decoration-none">Leave Types</a></li>
                            <li class="breadcrumb-item active text-white" aria-current="page">Edit</li>
                        </ol>
                    </nav>
                    <h2 class="fw-bold mb-1"><i class="bi bi-pencil-square me-2"></i>Edit Leave Type</h2>
                    <p class="mb-0 text-white-50">Update leave category specifications and validation constraints.</p>
                </div>
                <div>
                    <a href="/leave-types" class="btn btn-outline-light btn-sm"><i class="bi bi-arrow-left me-1"></i> Back to Types</a>
                </div>
            </div>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white border-bottom py-3">
                        <h5 class="card-title fw-bold mb-0 text-primary">Leave Type Configuration</h5>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/leave-types/{id}/edit(id=${leaveTypeDTO.id})}" th:object="${leaveTypeDTO}" method="post">
                            <input type="hidden" th:field="*{id}">

                            <div class="row g-3 mb-3">
                                <div class="col-md-8">
                                    <label for="typeName" class="form-label fw-semibold">Leave Type Name <span class="text-danger">*</span></label>
                                    <input type="text"
                                           id="typeName"
                                           th:field="*{name}"
                                           class="form-control"
                                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
                                           required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">
                                        Name error
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <label for="typeCode" class="form-label fw-semibold">Short Code <span class="text-danger">*</span></label>
                                    <input type="text"
                                           id="typeCode"
                                           th:field="*{code}"
                                           class="form-control font-monospace text-uppercase"
                                           th:classappend="${#fields.hasErrors('code')} ? 'is-invalid' : ''"
                                           required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('code')}" th:errors="*{code}">
                                        Code error
                                    </div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="typeDesc" class="form-label fw-semibold">Description</label>
                                <textarea id="typeDesc"
                                          th:field="*{description}"
                                          class="form-control"
                                          rows="3"></textarea>
                            </div>

                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label for="maxDays" class="form-label fw-semibold">Max Consecutive Days</label>
                                    <input type="number"
                                           id="maxDays"
                                           th:field="*{maxConsecutiveDays}"
                                           class="form-control"
                                           th:classappend="${#fields.hasErrors('maxConsecutiveDays')} ? 'is-invalid' : ''"
                                           placeholder="Optional (e.g. 5)">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('maxConsecutiveDays')}" th:errors="*{maxConsecutiveDays}">
                                        Max days error
                                    </div>
                                </div>
                                <div class="col-md-6 d-flex flex-column justify-content-center pt-3">
                                    <div class="form-check form-switch mb-2">
                                        <input class="form-check-input" type="checkbox" id="isPaid" th:field="*{paid}">
                                        <label class="form-check-label fw-semibold" for="isPaid">Paid Leave</label>
                                    </div>
                                    <div class="form-check form-switch mb-2">
                                        <input class="form-check-input" type="checkbox" id="requiresAttachment" th:field="*{requiresAttachment}">
                                        <label class="form-check-label fw-semibold" for="requiresAttachment">Requires Proof/Attachment</label>
                                    </div>
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" id="activeStatus" th:field="*{active}">
                                        <label class="form-check-label fw-semibold" for="activeStatus">Active</label>
                                    </div>
                                </div>
                            </div>

                            <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                                <a href="/leave-types" class="btn btn-outline-secondary">Cancel</a>
                                <button type="submit" class="btn btn-primary px-4 fw-semibold">
                                    <i class="bi bi-check2-circle me-1"></i> Update Leave Type
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white-50 py-3 mt-auto">
        <div class="container text-center">
            <small>Employee Leave &amp; Workforce Availability Planning Platform &bull; Phase 3</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
