<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied - 403 Forbidden</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .error-card {
            max-width: 500px;
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.06);
            border: none;
        }
        .icon-circle {
            width: 72px;
            height: 72px;
            background-color: #f8d7da;
            color: #dc3545;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin: 0 auto 1.5rem;
        }
    </style>
</head>
<body>

<div class="container py-4">
    <div class="card error-card mx-auto bg-white p-4 p-md-5 text-center">
        <div class="icon-circle shadow-sm">
            <i class="bi bi-shield-x"></i>
        </div>
        <h3 class="fw-bold text-dark mb-2">Access Denied</h3>
        <p class="text-danger fw-semibold mb-3">403 - Forbidden Request</p>
        <p class="text-secondary small mb-4">
            You do not have the required role or authorization to access this resource or execute this action.
            If you believe this is in error, please contact your system administrator or HR department.
        </p>

        <div class="d-flex justify-content-center gap-2">
            <a href="/" class="btn btn-primary px-4">
                <i class="bi bi-house-door me-1"></i> Return to Dashboard
            </a>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-outline-secondary px-3">
                    <i class="bi bi-box-arrow-right me-1"></i> Sign Out
                </button>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
