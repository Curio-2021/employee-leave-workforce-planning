<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Activation - Workforce Availability Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .activation-card {
            max-width: 480px;
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            border: none;
        }
        .brand-icon {
            width: 56px;
            height: 56px;
            background-color: #198754;
            color: #fff;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            margin: 0 auto 1rem;
        }
    </style>
</head>
<body>

<div class="container py-4">
    <div class="card activation-card mx-auto bg-white p-4 p-md-5">
        <div class="text-center mb-4">
            <div class="brand-icon shadow-sm">
                <i class="bi bi-person-check-fill"></i>
            </div>
            <h4 class="fw-bold text-dark">Account Activation</h4>
            <p class="text-muted small">Set your password to activate your portal account</p>
        </div>

        <!-- Feedback Alerts -->
        <div th:if="${errorMessage}" class="alert alert-danger d-flex align-items-center small py-2" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2 flex-shrink-0"></i>
            <div th:text="${errorMessage}">Activation error message.</div>
        </div>

        <form th:action="@{/activate}" method="post" class="mt-2">
            <div class="mb-3">
                <label for="token" class="form-label small fw-semibold text-secondary">Activation Token</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-key"></i></span>
                    <input type="text" class="form-control border-start-0" id="token" name="token" th:value="${token}" placeholder="Paste your activation token" required>
                </div>
                <div class="form-text small">Single-use token issued by Human Resources.</div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label small fw-semibold text-secondary">New Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control border-start-0" id="password" name="password" minlength="8" placeholder="At least 8 characters" required>
                </div>
            </div>

            <div class="mb-4">
                <label for="confirmPassword" class="form-label small fw-semibold text-secondary">Confirm Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-shield-check"></i></span>
                    <input type="password" class="form-control border-start-0" id="confirmPassword" name="confirmPassword" minlength="8" placeholder="Repeat password" required>
                </div>
            </div>

            <button type="submit" class="btn btn-success w-100 py-2 fw-semibold">
                <i class="bi bi-check2-circle me-1"></i> Activate Account
            </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top">
            <p class="text-muted small mb-1">Already have an active password?</p>
            <a th:href="@{/login}" class="text-decoration-none small fw-semibold">Sign In</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
