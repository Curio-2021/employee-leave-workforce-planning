<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Workforce Availability &amp; Leave Planning</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            max-width: 440px;
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            border: none;
        }
        .brand-icon {
            width: 56px;
            height: 56px;
            background-color: #0d6efd;
            color: #fff;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            margin: 0 auto 1rem;
        }
    </style>
</head>
<body>

<div class="container py-4">
    <div class="card login-card mx-auto bg-white p-4 p-md-5">
        <div class="text-center mb-4">
            <div class="brand-icon shadow-sm">
                <i class="bi bi-calendar2-check-fill"></i>
            </div>
            <h4 class="fw-bold text-dark">WorkforcePlan</h4>
            <p class="text-muted small">Employee Leave &amp; Workforce Availability Platform</p>
        </div>

        <!-- Feedback Alerts -->
        <div th:if="${errorMessage}" class="alert alert-danger d-flex align-items-center small py-2" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2 flex-shrink-0"></i>
            <div th:text="${errorMessage}">Invalid credentials or account locked.</div>
        </div>
        <div th:if="${infoMessage}" class="alert alert-info d-flex align-items-center small py-2" role="alert">
            <i class="bi bi-info-circle-fill me-2 flex-shrink-0"></i>
            <div th:text="${infoMessage}">You have been logged out.</div>
        </div>
        <div th:if="${successMessage}" class="alert alert-success d-flex align-items-center small py-2" role="alert">
            <i class="bi bi-check-circle-fill me-2 flex-shrink-0"></i>
            <div th:text="${successMessage}">Operation successful.</div>
        </div>

        <form th:action="@{/login}" method="post" class="mt-2">
            <div class="mb-3">
                <label for="username" class="form-label small fw-semibold text-secondary">Username or Employee ID</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control border-start-0" id="username" name="username" placeholder="e.g. EMP001 or admin" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label small fw-semibold text-secondary">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control border-start-0" id="password" name="password" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
            </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top">
            <p class="text-muted small mb-1">Received an invitation or activation link?</p>
            <a th:href="@{/activate}" class="text-decoration-none small fw-semibold">Activate Account</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
